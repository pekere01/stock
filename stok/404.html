<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayfa Bulunamadı — Sonçağ Stok</title>
<link rel="icon" type="image/jpeg" href="./logo.jfif">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #080808;
    color: #f0f0f0;
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 420px;
  }
  .logo {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    margin: 0 auto 24px;
    display: block;
    object-fit: cover;
  }
  .code {
    font-size: 72px;
    font-weight: 700;
    background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  p {
    font-size: 14px;
    color: #888;
    margin-bottom: 28px;
  }
  a.btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #3b82f6;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    padding: 11px 22px;
    border-radius: 10px;
    transition: background 0.2s;
  }
  a.btn:hover { background: #2563eb; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="./logo.jfif" alt="Sonçağ">
    <div class="code">404</div>
    <h1>Sayfa bulunamadı</h1>
    <p>Aradığınız sayfa taşınmış veya hiç var olmamış olabilir.</p>
    <a class="btn" href="/">← Dashboard'a dön</a>
  </div>
</body>
</html>
